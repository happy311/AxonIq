<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AxonIQ — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin.css?v=sec-1">
<link rel="stylesheet" href="/css/doctor.css?v=roles-1">
</head>
<body>

<!-- AUTH -->
<div id="authOverlay">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark">⚙</div>
      <div><h2>AxonIQ Admin</h2><p>Restricted access — authorised personnel only</p></div>
    </div>
    <div id="authError" class="auth-error"></div>
    <div class="auth-field">
      <label>Username</label>
      <input type="text" id="adminUser" placeholder="admin username" autocomplete="username">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="adminPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="auth-btn" data-action="adminLogin">Access Admin Panel</button>
  </div>
</div>

<!-- SHELL -->
<div id="adminShell">
  <header>
    <div class="logo-mark">⚙</div>
    <div class="header-text">
      <h1>AxonIQ Admin</h1>
      <p>User & Conversation Management</p>
    </div>
    <div class="header-right">
      <div class="hdr-stat"><div class="n" id="statUsers">—</div><div class="l">Users</div></div>
      <div class="hdr-stat"><div class="n" id="statSessions">—</div><div class="l">Sessions</div></div>
      <div class="hdr-stat"><div class="n" id="statMessages">—</div><div class="l">Messages</div></div>
      <button class="sign-out-btn" data-action="adminSignOut">Sign Out</button>
    </div>
  </header>

  <div class="page">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-section-title">Users</div>
        <input type="text" class="search-input" id="userSearch" placeholder="Search users…" data-input="filterUsers">
      </div>
      <div class="user-list" id="userList">
        <div class="loading"><div class="spin"></div> Loading users…</div>
      </div>
      <div style="padding:12px 16px;border-top:1px solid var(--border);">
        <button class="new-chat-side" style="width:100%;margin-bottom:8px;" data-action="showDoctors">🩺 Doctor Approvals <span id="pendingBadge" class="user-badge" style="display:none"></span></button>
        <button class="new-chat-side" style="width:100%;" data-action="showAllLogs">📋 View All Logs</button>
        <button class="new-chat-side" style="width:100%;margin-top:8px;" data-action="showAudit">🛡 Admin Audit Trail</button>
      </div>
    </div>

    <div class="main" id="mainPanel">
      <div class="empty-state">
        <div class="icon">👤</div>
        <p>Select a user from the sidebar to view their conversations</p>
      </div>
    </div>
  </div>
</div>

<script src="/js/utils.js?v=sec-1"></script>
<script src="/js/admin.js?v=sec-1"></script>
</body>
</html>
