# ── AxonIQ — Render blueprint ────────────────────────────────────────────────
# A persistent disk requires a PAID plan (free/spun-down instances lose all data, and the
# MRI engine needs RAM the free tier doesn't have). Pick a plan with >= 8 GB RAM for MRI use.
services:
  - type: web
    name: axoniq
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard_plus            # 8 GB; never "free" — no disk, no persistence
    region: oregon
    healthCheckPath: /health
    autoDeploy: false              # deploy deliberately; review before every release

    disk:
      name: axoniq-data
      mountPath: /data             # DB + Chroma. Enable Render's disk snapshots; see README for encrypted backups
      sizeGB: 20

    envVars:
      - { key: ENV, value: production }
      - { key: PYTHONUNBUFFERED, value: "1" }
      - { key: TIMEOUT_KEEP_ALIVE, value: "1800" }
      - { key: MRI_DEVICE, value: cpu }
      # Render's proxy sits in front: trust ONLY its forwarded header. Replace with the private
      # network range Render documents for your region if you tighten this further.
      - { key: FORWARDED_ALLOW_IPS, value: "10.0.0.0/8" }
      - { key: PUBLIC_BASE_URL, sync: false }        # https://your-service.onrender.com (or custom domain)
      - { key: ALLOWED_ORIGINS, value: "" }
      # ── secrets: set in the dashboard, never in git ──
      - { key: JWT_SECRET, sync: false }
      - { key: DATA_ENCRYPTION_KEY, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: SMTP_EMAIL, sync: false }
      - { key: SMTP_PASSWORD, sync: false }
      - { key: MRI_CHECKPOINT_SHA256, sync: false }
